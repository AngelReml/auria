<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Auria</title>
<style>
@font-face{font-family:'Alegreya';font-style:normal;font-weight:500;font-display:swap;src:url(fuentes/alegreya-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'Alegreya';font-style:normal;font-weight:700;font-display:swap;src:url(fuentes/alegreya-latin-700-normal.woff2) format('woff2')}
@font-face{font-family:'Alegreya';font-style:normal;font-weight:800;font-display:swap;src:url(fuentes/alegreya-latin-800-normal.woff2) format('woff2')}
@font-face{font-family:'Alegreya Sans';font-style:normal;font-weight:400;font-display:swap;src:url(fuentes/alegreya-sans-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:'Alegreya Sans';font-style:normal;font-weight:500;font-display:swap;src:url(fuentes/alegreya-sans-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'Alegreya Sans';font-style:normal;font-weight:700;font-display:swap;src:url(fuentes/alegreya-sans-latin-700-normal.woff2) format('woff2')}
</style>
<style>
/* Un solo mundo visual: la tarde que no avanza. Columna de móvil, escena arriba y mandos abajo. */
:root{
  --noche:#17131f; --panel:#241d30; --panel2:#2f2640; --linea:#43375a; --tinta:#f4ead9; --tenue:#b3a8c2;
  --ambar:#f0a23c; --ambar-tinta:#22160a; --vida:#63c784; --rafaga:#5fb6ee; --dano:#ef5a4c; --violeta:#8a63c9;
  --display:"Alegreya",Georgia,"Times New Roman",serif; --body:"Alegreya Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--noche);color:var(--tinta);font-family:var(--body);font-size:16px;line-height:1.35;overflow:hidden;touch-action:manipulation;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:3px solid var(--ambar);outline-offset:2px}
#app{height:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column;background:var(--noche);position:relative;overflow:hidden}
.barra{display:flex;gap:10px;align-items:center;padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--linea);font-family:var(--display);font-size:15px;font-variant-numeric:tabular-nums}
.barra .tit{flex:1;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rec{display:flex;align-items:center;gap:5px}
.ico{width:20px;height:20px;display:inline-grid;place-items:center;border-radius:4px;font:700 12px var(--display);color:#111;flex:none;background-size:contain;background-repeat:no-repeat;background-position:center;image-rendering:pixelated}
.cuerpo{flex:1;overflow-y:auto;overflow-x:hidden;position:relative;display:flex;flex-direction:column}
.pad{padding:14px 14px 20px;display:flex;flex-direction:column;gap:12px}
.nav{display:flex;background:var(--panel);border-top:1px solid var(--linea)}
.nav button{flex:1;padding:11px 2px 12px;font:500 14px var(--display);color:var(--tenue)}
.nav button[aria-current="page"]{color:var(--ambar);box-shadow:inset 0 3px 0 var(--ambar)}
h1{font:700 34px/1 var(--display);margin:0;letter-spacing:.02em}
h2{font:700 19px/1.1 var(--display);margin:0;text-wrap:balance}
p{margin:0}
.tenue{color:var(--tenue)}
.caja{background:var(--panel);border:1px solid var(--linea);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px}
.btn{background:var(--ambar);color:var(--ambar-tinta);font:700 16px var(--display);padding:12px 14px;border-radius:8px;text-align:center}
.btn.sec{background:var(--panel2);color:var(--tinta);border:1px solid var(--linea)}
.btn:disabled{opacity:.4}
.fila{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.fila>.btn{flex:1}
.fondo{position:absolute;inset:0;background-size:cover;background-position:center;z-index:0}
.sobre{position:relative;z-index:1}
/* plaza */
.plaza{flex:1;display:flex;flex-direction:column;justify-content:flex-end;padding:16px 14px;gap:12px;position:relative;min-height:100%}
.plaza .velo{position:absolute;inset:0;background:linear-gradient(180deg,rgba(23,19,31,.15) 0%,rgba(23,19,31,.2) 40%,rgba(23,19,31,.94) 78%);z-index:0}
.sol{position:absolute;top:9%;left:50%;width:120px;height:120px;margin-left:-60px;border-radius:50%;background:radial-gradient(circle,#ffe2a0 0%,#f0a23c 55%,rgba(240,162,60,0) 72%);z-index:0}
.sol::after{content:"";position:absolute;inset:14px;left:34px;border-radius:50%;background:#17131f}
/* mapa */
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 14px;background:var(--panel);border-bottom:1px solid var(--linea);flex:none}
.chip{flex:none;padding:7px 12px;border-radius:999px;border:1px solid var(--linea);font:500 14px var(--display);color:var(--tinta);background:var(--panel2)}
.chip[aria-pressed="true"]{background:var(--ambar);color:var(--ambar-tinta);border-color:var(--ambar)}
.chip:disabled{opacity:.35}
.area{display:flex;flex-direction:column;gap:8px}
.nodos{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.nodo{aspect-ratio:1;border-radius:10px;border:2px solid var(--linea);background:var(--panel2);font:700 17px var(--display);display:grid;place-items:center;position:relative}
.nodo.hecha{border-color:var(--vida);color:var(--vida)}
.nodo.abierta{border-color:var(--ambar);color:var(--ambar);box-shadow:0 0 0 3px rgba(240,162,60,.25)}
.nodo:disabled{opacity:.35}
.nodo.jefe{border-radius:50%}
.nodo small{position:absolute;bottom:3px;font:500 10px var(--display);color:var(--tenue)}
/* unidades */
.rejilla{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ficha{background:var(--panel);border:2px solid var(--linea);border-radius:10px;padding:6px;display:flex;flex-direction:column;gap:4px;align-items:stretch;text-align:left;position:relative;min-width:0}
.ficha.en{border-color:var(--ambar)}
.ficha .img{aspect-ratio:1;border-radius:6px;overflow:hidden;background:var(--panel2);position:relative}
.ficha .nom{font:700 14px var(--display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ficha .sub{font-size:12px;color:var(--tenue);display:flex;justify-content:space-between;font-variant-numeric:tabular-nums}
.estrellas{color:var(--ambar);font-size:12px;letter-spacing:1px}
.punto{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
.arte{position:absolute;inset:0;background-size:contain;background-repeat:no-repeat;background-position:center bottom}
.arte.pix{image-rendering:pixelated}
.arte.busto{background-size:cover;background-position:center top}
canvas.arte{width:100%;height:100%;image-rendering:pixelated}
.detalle .grande{height:300px;position:relative;border-radius:10px;overflow:hidden;background:linear-gradient(180deg,var(--panel2),var(--noche))}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;font-family:var(--display);text-align:center}
.stats div{background:var(--panel2);border-radius:8px;padding:8px 4px}
.stats b{display:block;font-size:18px}
.stats span{font-size:12px;color:var(--tenue)}
.medidor{height:8px;background:#110d18;border-radius:4px;overflow:hidden}
.medidor i{display:block;height:100%;background:var(--vida)}
.medidor.bb i{background:var(--rafaga)}
.medidor.xp i{background:var(--violeta)}
.receta{display:flex;flex-wrap:wrap;gap:6px 12px;font:500 13px var(--display)}
.receta span{display:inline-flex;align-items:center;gap:4px}
.receta .falta{color:var(--dano)}
.caja.final{border-color:#ffd76a;box-shadow:0 0 0 1px rgba(255,215,106,.4)}
.nav button{font-size:13px}
/* piezas ilustradas */
.punto.emb{width:16px;height:16px;border-radius:0;background-size:contain;background-repeat:no-repeat;image-rendering:pixelated;vertical-align:-3px}
.estrellas.estr{display:inline-flex;gap:1px;letter-spacing:0;align-items:center}
.estrellas.estr i{width:12px;height:12px;background-size:contain;image-rendering:pixelated}
.nav button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 2px 8px}
.nico{width:26px;height:26px;background-size:contain;background-repeat:no-repeat;image-rendering:pixelated;filter:grayscale(.6) brightness(.8)}
.nav button[aria-current="page"] .nico{filter:none}
.portada{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-start;align-items:center;width:100%;overflow:hidden}
.portada-velo{position:absolute;inset:0;background:linear-gradient(180deg,rgba(23,19,31,.55) 0%,rgba(23,19,31,0) 38%,rgba(23,19,31,0) 70%,rgba(23,19,31,.85) 100%)}
.portada-txt{display:flex;flex-direction:column;align-items:center;gap:6px;padding-top:8%;height:100%}
.portada-txt h1{font-size:64px;text-shadow:0 4px 0 #000,0 0 24px rgba(240,162,60,.8)}
.portada-txt p{margin-top:auto;margin-bottom:9%;font:700 18px var(--display);text-shadow:0 2px 0 #000;animation:late 1.1s infinite alternate}
.emblema{width:120px;height:120px;background-size:contain;background-repeat:no-repeat;background-position:center;filter:drop-shadow(0 6px 10px rgba(0,0,0,.6))}
.emblema.peq{width:54px;height:54px}
.cabecera-region{height:150px;background-size:cover;background-position:center 35%;display:flex;align-items:flex-end;padding:10px 14px;flex:none}
.cabecera-region h2{font-size:24px;text-shadow:0 2px 0 #000,0 0 10px #000}
.ficha .img{aspect-ratio:3/4}
.ficha .img .arte{background-size:150%;background-position:50% 6%}
.ficha .img .arte.pix{background-size:contain;background-position:center bottom}
.marco{position:absolute;inset:0;background-size:100% 100%;pointer-events:none;z-index:2}
.ficha .img .marco{inset:-2px}
.aparicion{position:absolute;inset:0;z-index:40;overflow:hidden;display:block;width:100%}
.ap-velo{position:absolute;inset:0;background:rgba(10,8,14,.55)}
.ap-circulo{position:absolute;left:5%;right:5%;bottom:21%;aspect-ratio:1;background-size:contain;background-repeat:no-repeat;background-position:center;mix-blend-mode:screen;transform:rotateX(62deg);animation:apgira 6s linear infinite;image-rendering:pixelated}
.ap-circulo.css{border-radius:50%;border:4px double #8f8cf0;box-shadow:0 0 30px #8f8cf0,inset 0 0 30px #8f8cf0}
@keyframes apgira{to{transform:rotateX(62deg) rotate(360deg)}}
.ap-haz{position:absolute;left:15%;right:15%;top:6%;bottom:30%;background-size:contain;background-repeat:no-repeat;background-position:center bottom;mix-blend-mode:screen;animation:aphaz 1.3s ease-out both;image-rendering:pixelated}
.ap-haz.css{background:linear-gradient(90deg,rgba(0,0,0,0),#fff 50%,rgba(0,0,0,0))}
@keyframes aphaz{0%{transform:scaleY(0);opacity:0;transform-origin:bottom}35%{transform:scaleY(1.15);opacity:1}100%{transform:scaleY(1);opacity:.55}}
.ap-eco{position:absolute;left:8%;right:8%;top:12%;bottom:30%;animation:apeco 1.5s ease-out both}
.ap-eco .arte{background-size:contain;background-position:center bottom}
@keyframes apeco{0%,35%{opacity:0;transform:translateY(20px);filter:brightness(6)}100%{opacity:1;transform:none;filter:none}}
.ap-txt{position:absolute;left:0;right:0;bottom:8%;text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px;animation:apeco 1.9s ease-out both;text-shadow:0 2px 0 #000}
.aparicion.r4 .ap-txt h1{color:#ffd76a}
.cinta{height:74px;background-size:contain;background-repeat:no-repeat;background-position:center;display:grid;place-items:center;margin:-34px -8px 0}
.cinta span{font:700 24px var(--display);color:#3a2408;text-shadow:0 1px 0 rgba(255,255,255,.4);padding-bottom:8px}
.capa.resultado .caja{background:rgba(36,29,48,.93)}
.cuadro{position:absolute;inset:0;background-size:cover;background-position:center;opacity:0;transition:opacity .5s;z-index:0}
.cuadro.on{opacity:1}
.dlg-caja.papel{background-color:transparent;background-size:100% 100%;background-repeat:no-repeat;border-top:0;padding:40px 40px 34px;color:#3b2a16;min-height:216px;margin:0 2px 4px}
.dlg-caja.papel .dlg-nom{color:#8a2a12}
.dlg-caja.papel .dlg-pie{color:#7a6444}
.dlg-caja.papel .dlg-txt.narr{color:#5a4630}
.cara.enmarcada{border:0;border-radius:0;overflow:visible;background:none}
.cara.enmarcada .mira{inset:9%;overflow:hidden;background:var(--panel2);border-radius:4px}
.cara.enmarcada.der .marco{transform:scaleX(-1)}
.lucha .arte[data-hoja]{transform:scale(1.35);transform-origin:50% 100%}
.lucha.a .arte[data-hoja]{transform:scale(1.5)}
.lucha.jefe .arte[data-hoja]{transform:scale(1.25)}
.mira-obj{position:absolute;inset:-12%;background-size:contain;background-repeat:no-repeat;background-position:center;animation:mirapulso .8s infinite alternate;pointer-events:none;z-index:6}
@keyframes mirapulso{to{transform:scale(.9)}}
.lucha.con-mira::before{box-shadow:none;background:rgba(0,0,0,.35);animation:none}
.chispa.img{width:18px;height:18px;margin:-9px;background-color:transparent;background-size:contain;background-repeat:no-repeat;box-shadow:none;border-radius:0;transform:none;image-rendering:pixelated;filter:drop-shadow(0 0 4px #fff)}
.fx.tajo-img{inset:-45%;transform:rotate(var(--g));animation:tajoimg .3s forwards}
@keyframes tajoimg{0%{opacity:0;scale:.5}40%{opacity:1;scale:1.1}100%{opacity:0;scale:1.25}}
.modos button.con-ico{background-image:var(--ico);background-repeat:no-repeat;background-size:16px;background-position:4px center;padding-left:18px;image-rendering:pixelated}
/* combate */
.campo{position:relative;flex:1 1 40%;min-height:220px;overflow:hidden;background:#222}
.campo.tiembla{animation:tiembla .22s}.campo.tiembla2{animation:tiembla2 .4s}
@keyframes tiembla{25%{transform:translate(3px,-2px)}50%{transform:translate(-3px,2px)}75%{transform:translate(2px,1px)}}
@keyframes tiembla2{15%{transform:translate(7px,-4px)}30%{transform:translate(-7px,5px)}45%{transform:translate(6px,3px)}60%{transform:translate(-5px,-3px)}80%{transform:translate(3px,2px)}}
.suelo{position:absolute;left:0;right:0;bottom:0;height:34%;background:linear-gradient(180deg,rgba(0,0,0,0),rgba(0,0,0,.28))}
.lucha{position:absolute;width:26%;aspect-ratio:1;transition:transform .13s cubic-bezier(.2,.9,.3,1.3)}
.lucha.jefe{width:36%}
.lucha .arte{background-position:center bottom}
.lucha .vol{position:absolute;inset:0;filter:drop-shadow(0 3px 0 rgba(0,0,0,.35))}
.lucha::before{content:"";position:absolute;left:14%;right:14%;bottom:-3%;height:10%;border-radius:50%;background:rgba(0,0,0,.35)}
.lucha.obj::before{background:var(--ambar);box-shadow:0 0 10px var(--ambar);animation:late 1s infinite alternate}
@keyframes late{to{opacity:.45}}
.lucha .hp{position:absolute;left:12%;right:12%;top:-9px}
.lucha .hp .medidor{height:6px;border:1px solid #000}
.lucha .medidor i{transition:width .25s}
.nombre-e{position:absolute;left:0;right:-160%;top:-25px;text-align:left;font:500 10px var(--display);text-shadow:0 1px 0 #000,0 0 4px #000;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:0}
.lucha.obj .nombre-e{opacity:1}
.lucha.cayendo{transition:transform .38s ease-in,opacity .38s;transform:translateY(12%) rotate(-8deg)!important;opacity:.5}
.lucha.caido{opacity:.22;filter:grayscale(1)}
.lucha.golpe .vol{animation:golpe .24s}
.lucha.carga .vol{filter:drop-shadow(0 0 10px var(--dano)) brightness(1.35);animation:carga .5s infinite alternate}
@keyframes carga{to{filter:drop-shadow(0 0 3px var(--dano)) brightness(1.05)}}
.lucha.feroz .vol{filter:hue-rotate(150deg) saturate(1.4)}
.lucha.guardia::after{content:"";position:absolute;inset:-6%;border-radius:50%;border:3px solid var(--rafaga);box-shadow:0 0 12px var(--rafaga),inset 0 0 12px rgba(95,182,238,.5);opacity:.8}
@keyframes golpe{0%{filter:brightness(4) saturate(0)}35%{transform:translateX(7px) rotate(3deg)}65%{transform:translateX(-5px)}100%{filter:none}}
.num{position:absolute;left:50%;top:6%;font:700 24px var(--display);color:#fff;text-shadow:0 2px 0 #000,2px 0 0 #000,-2px 0 0 #000,0 -2px 0 #000;animation:sube .8s cubic-bezier(.2,1.4,.4,1) forwards;pointer-events:none;white-space:nowrap;transform:translateX(-50%);z-index:8}
.num.fuerte{color:var(--ambar);font-size:32px}.num.flojo{color:#b9b9cc;font-size:18px}.num.cura{color:var(--vida)}
@keyframes sube{0%{transform:translateX(-50%) scale(.4)}25%{transform:translateX(-50%) scale(1.35)}100%{top:-38%;opacity:0;transform:translateX(-50%) scale(1)}}
.fx{position:absolute;inset:-25%;background-size:contain;background-repeat:no-repeat;background-position:center;mix-blend-mode:screen;animation:fx .38s forwards;pointer-events:none;image-rendering:pixelated;z-index:6}
.fx.css{border-radius:50%;background:radial-gradient(circle,#fff 0%,var(--c,#f0a23c) 30%,rgba(0,0,0,0) 68%)}
.fx.grande{inset:-70%;animation-duration:.7s}
.fx.sube{animation:fxsube .6s forwards}
.fx.escudo.css{background:radial-gradient(circle,rgba(0,0,0,0) 45%,var(--c) 58%,rgba(0,0,0,0) 70%);animation-duration:.6s}
@keyframes fx{from{transform:scale(.3) rotate(-20deg);opacity:1}to{transform:scale(1.2) rotate(15deg);opacity:0}}
@keyframes fxsube{from{transform:translateY(25%) scale(.6);opacity:1}to{transform:translateY(-35%) scale(1.1);opacity:0}}
.tajo{position:absolute;left:-30%;right:-30%;top:46%;height:8%;background:linear-gradient(90deg,rgba(255,255,255,0),#fff 35%,var(--c) 65%,rgba(255,255,255,0));border-radius:50%;transform:rotate(var(--g)) scaleX(0);animation:tajo .24s forwards;z-index:7;pointer-events:none;box-shadow:0 0 10px var(--c)}
@keyframes tajo{40%{transform:rotate(var(--g)) scaleX(1);opacity:1}100%{transform:rotate(var(--g)) scaleX(1.2);opacity:0}}
.destello{position:absolute;inset:0;background:radial-gradient(circle at 30% 60%,var(--c),rgba(0,0,0,0) 70%);mix-blend-mode:screen;animation:destello .42s forwards;pointer-events:none;z-index:3}
.destello.largo{animation-duration:.9s;background:radial-gradient(circle at 30% 60%,#fff,var(--c) 35%,rgba(0,0,0,0) 85%)}
@keyframes destello{0%{opacity:0}20%{opacity:1}100%{opacity:0}}
.corte{position:absolute;left:0;right:0;top:30%;height:30%;display:flex;align-items:center;gap:10px;padding:0 12px;z-index:9;pointer-events:none;
  background:linear-gradient(90deg,var(--c),rgba(23,19,31,.92) 62%);border-top:3px solid #fff;border-bottom:3px solid #fff;animation:corte .8s forwards;transform-origin:left}
.corte.sup{top:22%;height:44%;animation-duration:1.1s;background:linear-gradient(90deg,#fff,var(--c) 25%,rgba(23,19,31,.94) 75%);border-color:var(--ambar)}
.corte-cara{height:100%;aspect-ratio:1;position:relative;flex:none}
.corte-txt{display:flex;flex-direction:column;font-family:var(--display);text-shadow:0 2px 0 #000}
.corte-txt small{font-size:13px;letter-spacing:.12em;text-transform:uppercase}
.corte-txt b{font-size:24px;line-height:1}
.corte.sup .corte-txt b{font-size:30px;color:var(--ambar)}
@keyframes corte{0%{transform:translateX(-105%)}14%{transform:translateX(0)}80%{transform:translateX(0);opacity:1}100%{transform:translateX(40%);opacity:0}}
.chispa{position:absolute;width:12px;height:12px;margin:-6px;z-index:30;pointer-events:none;transition:transform .44s cubic-bezier(.5,-.4,.6,1);transform:rotate(45deg)}
.chispa.cristal{background:var(--rafaga);box-shadow:0 0 8px var(--rafaga),0 0 2px #fff inset}
.aviso{position:absolute;left:8px;right:8px;top:8px;text-align:center;font:700 15px var(--display);text-shadow:0 2px 0 #000,0 0 6px #000;z-index:10;pointer-events:none;opacity:0}
.aviso.sale{animation:aviso 2.2s forwards}
@keyframes aviso{0%{opacity:0;transform:translateY(-8px)}10%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0}}
.mandos{flex:none;display:flex;flex-direction:column;gap:6px;padding:6px 8px 8px;background:var(--noche)}
.ayuda{font:500 11px var(--display);color:var(--tenue);text-align:center}
.cartas{display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:100px;gap:6px}
.carta{background:var(--panel);border:2px solid var(--linea);border-radius:8px;display:grid;grid-template-rows:auto minmax(0,1fr);overflow:hidden;position:relative;min-width:0;min-height:0;max-height:132px;touch-action:none;cursor:pointer;transition:transform .08s}
.carta:active{transform:scale(.97)}
.carta.lista{border-color:var(--ambar)}
.carta.carga{border-color:var(--rafaga);box-shadow:0 0 10px rgba(95,182,238,.6)}
.carta.super{border-color:#ffd76a;box-shadow:0 0 14px rgba(255,215,106,.85);animation:brillo .6s infinite alternate}
@keyframes brillo{to{box-shadow:0 0 3px rgba(255,215,106,.5)}}
.carta.hecha .cc,.carta.hecha .cn{opacity:.4}
.carta.ko{filter:grayscale(1);opacity:.45}
.carta.herida{animation:herida .3s}
@keyframes herida{30%{background:var(--dano);transform:translateX(4px)}60%{transform:translateX(-3px)}}
.cn{display:flex;gap:6px;align-items:center;font:700 14px var(--display);padding:4px 7px 3px}
.cn .n{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cn .pista{font-size:11px;color:var(--rafaga)}
.carta.super .pista{color:#ffd76a}
.cc{display:flex;gap:7px;min-height:0;padding:0 6px 6px}
.ci{position:relative;height:100%;aspect-ratio:1;flex:none;background:var(--panel2);overflow:hidden;border-radius:6px;border:1px solid var(--linea)}
.ci .arte{background-size:cover;background-position:center 18%}
.ci .arte.busto{background-size:300%}
.ci .arte.prov{background-size:78%;background-position:center}
.cb{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;justify-content:center}
.cb .l2{font:500 11px var(--display);color:var(--tenue);font-variant-numeric:tabular-nums}
.medidor.bb{position:relative}
.medidor.bb b{position:absolute;left:0;top:0;height:100%;background:#ffd76a}
.cb .medidor i,.cb .medidor b{transition:width .25s}
.modos{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
.modos button{background:var(--panel2);border:1px solid var(--linea);border-radius:8px;padding:9px 0;font:500 12px var(--display);white-space:nowrap;overflow:hidden}
.modos button[aria-pressed="true"]{background:var(--ambar);color:var(--ambar-tinta);border-color:var(--ambar)}
.modos button:disabled{opacity:.35}
.fxcanvas{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;pointer-events:none;z-index:5}
.lucha .vol{animation:respira 2.4s ease-in-out infinite alternate}
.lucha:nth-child(odd) .vol{animation-delay:-1.1s}.lucha:nth-child(3n) .vol{animation-duration:2.9s}
.lucha.caido .vol,.lucha.aturdido .vol{animation:none}
@keyframes respira{to{translate:0 -3%}}
.intento{position:absolute;left:50%;top:-46px;transform:translateX(-50%);white-space:nowrap;font:700 11px var(--display);padding:3px 7px;border-radius:999px;background:rgba(23,19,31,.85);border:1px solid var(--linea);color:var(--tinta);z-index:7}
.intento.p1{border-color:var(--ambar);color:var(--ambar)}
.intento.p2{background:var(--dano);border-color:#fff;color:#fff;animation:alerta .45s infinite alternate}
@keyframes alerta{to{transform:translateX(-50%) scale(1.12)}}
.lucha.jefe .intento{font-size:12px}
.lucha.e:not(.obj) .nombre-e{display:none}
.ruptura{position:absolute;left:8%;right:8%;bottom:-13px;height:7px;border:1px solid #fff;border-radius:4px;background:#2a0d0d;overflow:hidden;z-index:7}
.ruptura i{display:block;height:100%;background:linear-gradient(90deg,#ffd76a,#fff);transition:width .15s}
.lucha.cubierto::after{content:"";position:absolute;inset:-4%;border-radius:50%;border:3px solid #cfd6e6;box-shadow:inset 0 0 14px rgba(207,214,230,.6);opacity:.85}
.lucha.aturdido .vol{filter:grayscale(.7) brightness(.8);transform:rotate(-6deg)}
.lucha.aturdido::after{content:"✦ ✦ ✦";position:absolute;left:0;right:0;top:-6%;text-align:center;color:#ffd76a;font-size:12px;letter-spacing:2px;animation:gira 1s linear infinite;border:0;box-shadow:none}
@keyframes gira{50%{letter-spacing:6px;opacity:.6}}
.lucha.furia .vol{filter:drop-shadow(0 0 6px #ef5a4c) saturate(1.5)}
.lucha.marcado::after{content:"";position:absolute;inset:6%;border-radius:50%;border:3px dashed var(--dano);animation:mira 1.2s linear infinite;box-shadow:0 0 10px var(--dano)}
@keyframes mira{to{rotate:360deg}}
.carta.marcada{border-color:var(--dano);box-shadow:0 0 12px rgba(239,90,76,.8);animation:brilloR .5s infinite alternate}
@keyframes brilloR{to{box-shadow:0 0 3px rgba(239,90,76,.4)}}
.carta.marcada .pista{color:var(--dano)}
.num.parada{color:#bfe6ff;font-size:19px}.num.marca{color:var(--dano);font-size:16px}
.cadena{position:absolute;right:8px;bottom:8px;font:700 14px var(--display);color:var(--rafaga);text-shadow:0 2px 0 #000,0 0 6px #000;z-index:10;opacity:0;pointer-events:none}
.cadena.on{opacity:1}.cadena.alta{color:#ffd76a;font-size:18px}
.cadena.salta{animation:salta .35s}
@keyframes salta{30%{transform:scale(1.5)}}
.rotulo{position:absolute;left:0;right:0;top:38%;text-align:center;font:700 28px var(--display);color:#fff;text-shadow:0 3px 0 #000,0 0 14px #000;z-index:11;pointer-events:none;animation:rotulo 1.1s forwards;letter-spacing:.04em}
.rotulo.peligro{color:var(--dano)}.rotulo.bien{color:#ffd76a}.rotulo.enemigo{font-size:18px;color:var(--tenue);top:12%}
@keyframes rotulo{0%{transform:scale(2.2);opacity:0}18%{transform:scale(1);opacity:1}75%{opacity:1}100%{transform:scale(.9) translateY(-12px);opacity:0}}
.chispa.corazon{background:#ff7a9a;box-shadow:0 0 8px #ff7a9a;border-radius:50% 50% 0 50%}
.chips.grados{padding-top:8px;padding-bottom:8px}
.chip.g1[aria-pressed="true"]{background:var(--violeta);border-color:var(--violeta);color:#fff}
.chip.g2[aria-pressed="true"]{background:#111;border-color:#ffd76a;color:#ffd76a;box-shadow:0 0 8px rgba(255,215,106,.6)}
.capa.victoria{background:radial-gradient(circle at 50% 30%,rgba(255,215,106,.28),rgba(10,8,14,.8) 70%)}
.capa.victoria .caja{animation:entra .35s cubic-bezier(.2,1.3,.4,1)}
@keyframes entra{from{transform:scale(.7) translateY(20px);opacity:0}}
/* capas */
.capa{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;justify-content:flex-end;background:rgba(10,8,14,.72)}
.capa.centro{justify-content:center;padding:18px}
/* diálogo: el fondo del lugar, dos caras que se miran y el texto */
.escena{position:absolute;inset:0;z-index:25;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden;background:var(--noche)}
.esc-velo{position:absolute;inset:0;background:linear-gradient(180deg,rgba(23,19,31,0) 45%,rgba(23,19,31,.55) 100%);z-index:0}
.caras{position:relative;z-index:1;display:flex;justify-content:space-between;align-items:flex-end;padding:0 10px;margin-bottom:-14px}
.cara{width:40%;aspect-ratio:1;position:relative;border-radius:10px;overflow:hidden;border:3px solid var(--linea);background:var(--panel2);transition:transform .18s,filter .18s;filter:brightness(.5) saturate(.6);transform:scale(.86);transform-origin:bottom center}
.cara.habla{filter:none;transform:scale(1);border-color:var(--ambar);box-shadow:0 6px 18px rgba(0,0,0,.5);z-index:2}
.cara.vacia{visibility:hidden}
.cara .mira{position:absolute;inset:0}
.cara.der .mira{transform:scaleX(-1)}
.cara .arte{background-size:cover;background-position:center top}
.cara .arte.busto{background-size:300%}
.cara .arte.prov{background-size:70%;background-position:center 60%}
.dlg-caja{position:relative;z-index:1;background:rgba(36,29,48,.96);border-top:3px solid var(--ambar);padding:22px 16px 20px;min-height:168px;display:flex;flex-direction:column;gap:6px}
.dlg-nom{font:700 17px var(--display);color:var(--ambar);min-height:20px}
.dlg-txt{font-size:18px;line-height:1.35}
.dlg-txt.narr{font-style:italic;color:var(--tenue);text-align:center}
.dlg-pie{display:flex;justify-content:space-between;font:500 13px var(--display);color:var(--tenue);margin-top:auto}
.lista-premios{display:flex;flex-direction:column;gap:4px;font-family:var(--display)}
.lista-premios div{display:flex;justify-content:space-between;gap:10px}
textarea{width:100%;min-height:90px;background:#110d18;color:var(--tinta);border:1px solid var(--linea);border-radius:8px;padding:8px;font:12px ui-monospace,Menlo,monospace;user-select:text;-webkit-user-select:text}
/* ===== mapa de la región ===== */
.lienzo{flex:1;position:relative;overflow:hidden;background-size:cover;background-position:center;min-height:0;animation:vista .35s}
.lienzo-velo{position:absolute;inset:0;background:linear-gradient(180deg,rgba(23,19,31,.25),rgba(23,19,31,0) 30%,rgba(23,19,31,.2) 55%,rgba(23,19,31,.96) 86%)}
.lienzo-mapa{position:absolute;left:0;right:0;top:0;bottom:178px}
.camino{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.camino polyline{fill:none;stroke:#fff3d0;stroke-width:1.1;stroke-dasharray:2.2 2.2;stroke-linecap:round;opacity:.85;vector-effect:non-scaling-stroke;stroke-width:3px;stroke-dasharray:7 8;filter:drop-shadow(0 1px 0 #000);animation:camino 1.4s linear infinite}
@keyframes camino{to{stroke-dashoffset:-15}}
.lugar{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:2px;z-index:6}
.lugar .pin{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--panel2);border:3px solid #fff3d0;box-shadow:0 4px 0 rgba(0,0,0,.5);font:700 16px var(--display);color:#fff3d0}
.lugar .rot{font:700 12px var(--display);color:#fff;text-shadow:0 2px 0 #000,0 0 6px #000,1px 0 0 #000,-1px 0 0 #000;white-space:nowrap;margin-top:6px;background:rgba(23,19,31,.55);padding:1px 6px;border-radius:6px}
.lugar.hecha .pin{background:#2e6b47;border-color:#9be3b5}
.lugar.sel .pin{background:var(--ambar);color:var(--ambar-tinta);border-color:#fff;animation:pinsalta .7s infinite alternate;box-shadow:0 0 16px var(--ambar),0 4px 0 rgba(0,0,0,.5)}
.lugar.sel .rot{background:var(--ambar);color:var(--ambar-tinta);text-shadow:none}
.lugar.jefe .pin{width:46px;height:46px;border-color:#ef5a4c}
.lugar:disabled{opacity:.55;filter:grayscale(1)}
.lugar.secreta .pin{background:#3d2f7a;border-color:#c9b6ff;border-radius:50%;animation:secreta 1.6s infinite}
.lugar.secreta.raid .pin{background:#5a1420;border-color:#ff9a8c}
@keyframes secreta{50%{box-shadow:0 0 18px #c9b6ff,0 4px 0 rgba(0,0,0,.5)}}
@keyframes pinsalta{to{translate:0 -6px}}
.lugar-pie{position:absolute;left:0;right:0;bottom:0;padding:10px 14px 12px;display:flex;flex-direction:column;gap:8px;z-index:7}
.lugar-tit small{font:500 13px var(--display);color:var(--ambar);letter-spacing:.08em;text-transform:uppercase}
.lugar-tit h1{font:700 30px/1.05 var(--display);color:#fff;text-shadow:0 3px 0 #000,0 0 18px rgba(0,0,0,.9);animation:titulo .45s cubic-bezier(.2,1.2,.4,1)}
@keyframes titulo{from{opacity:0;transform:translateX(-18px);letter-spacing:.2em}}
.lugar-txt{font-size:14px;color:var(--tinta);text-shadow:0 1px 0 #000}
.lugar-pie .nodo{background:rgba(36,29,48,.88);backdrop-filter:blur(3px);aspect-ratio:auto;height:58px}
.lugar-pie .nodo.abierta{animation:nodolate 1s infinite alternate}
@keyframes nodolate{to{box-shadow:0 0 0 6px rgba(240,162,60,.12),0 0 14px rgba(240,162,60,.6)}}

/* ===== entrada a la misión y conversaciones sobre el combate ===== */
.escena.sobre{background:linear-gradient(180deg,rgba(23,19,31,.78),rgba(23,19,31,.15) 38%,rgba(23,19,31,.1) 55%,rgba(23,19,31,.7));animation:vista .3s}
.escena.sale{opacity:0;transition:opacity .22s;pointer-events:none}
.ent-cab{position:absolute;left:0;right:0;top:0;padding:16px 16px 0;z-index:2;display:flex;flex-direction:column;gap:4px;animation:titulo .5s cubic-bezier(.2,1.2,.4,1)}
.ent-reg{font:500 13px var(--display);color:var(--ambar);letter-spacing:.1em;text-transform:uppercase}
.ent-cab h1{font:700 30px/1.05 var(--display);color:#fff;text-shadow:0 3px 0 #000,0 0 16px #000}
.ent-cab h1::after{content:"";display:block;height:3px;margin-top:6px;background:linear-gradient(90deg,var(--ambar),transparent);animation:raya .7s ease-out}
@keyframes raya{from{transform:scaleX(0);transform-origin:left}}
.ent-els,.ent-con{font:500 14px var(--display);color:var(--tinta);display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;text-shadow:0 1px 0 #000}
.ent-con{color:#ffe3a8}
.cara .mira.enemigo{transform:none!important;background:radial-gradient(circle at 50% 70%,#4a2530,#1c1420)}
.cara .mira.enemigo .arte{background-size:300% 200%!important;transform:scale(1.25);transform-origin:50% 90%}
.dlg-txt.entra{animation:texto .28s ease-out}
@keyframes texto{from{opacity:0;transform:translateY(6px)}}

/* ===== combate: chispas, compás, límite ===== */
.chispas{position:absolute;left:8px;top:34px;font:700 18px var(--display);color:#fff7a0;text-shadow:0 2px 0 #000,0 0 10px #ffb400;z-index:12;opacity:0;pointer-events:none;transition:opacity 1.2s 1.2s}
.chispas.on{opacity:1;transition:none}.chispas.alta{font-size:24px;color:#fff}
.chispas.salta{animation:salta .3s}
.num.chispa{color:#fff7a0;font-size:30px;text-shadow:0 2px 0 #000,0 0 12px #ffb400,2px 0 0 #000,-2px 0 0 #000}
.limite{position:absolute;right:8px;top:8px;font:700 13px var(--display);color:#fff;background:rgba(239,90,76,.85);padding:2px 8px;border-radius:999px;z-index:12}
.compas{position:relative;height:5px;background:rgba(255,255,255,.1);border-radius:3px;margin-top:2px}
.compas i{position:absolute;top:-1px;width:4px;height:7px;border-radius:2px;background:#fff7a0;box-shadow:0 0 4px #ffb400}
.compas.grande{height:10px;margin:4px 0}.compas.grande i{width:7px;height:16px;top:-3px}
.lucha .vol.gira{transform:scaleX(-1)}
.lucha.a::before,.lucha.e::before{left:18%;right:18%;bottom:1%;height:9%;background:radial-gradient(ellipse,rgba(0,0,0,.6),rgba(0,0,0,0) 70%)}
.suelo{height:42%;background:linear-gradient(180deg,rgba(0,0,0,0),rgba(0,0,0,.34))}

/* ===== ecos: estrellas, rasgos ===== */
.rasgo{display:flex;flex-direction:column;gap:2px;padding:8px 10px;border-radius:8px;border:1px dashed var(--linea);opacity:.55}
.rasgo.on{opacity:1;border:1px solid var(--ambar);background:linear-gradient(90deg,rgba(240,162,60,.16),transparent)}
.rasgo b{font:700 15px var(--display);display:flex;gap:6px;align-items:center}
.rasgo span{font-size:14px;color:var(--tenue)}
.detalle .grande .halo{position:absolute;inset:-20%;background:radial-gradient(circle at 50% 60%,var(--c),transparent 60%);opacity:.35;animation:halo 3s ease-in-out infinite alternate}
.detalle .grande.e4 .halo{opacity:.5}.detalle .grande.e5 .halo{opacity:.75;animation-duration:1.6s}
@keyframes halo{to{transform:scale(1.15);opacity:.2}}
.ficha.sube::after{content:"★ lista";position:absolute;right:4px;top:4px;font:700 11px var(--display);background:#ffd76a;color:#3a2a00;padding:1px 6px;border-radius:999px;animation:pinsalta .6s infinite alternate;z-index:3}
.ficha .img.objeto{display:grid;place-items:center;background:radial-gradient(circle,#4a3d66,#1c1626)}
.ficha .img.objeto>*{width:64%;height:64%}
.ficha.raro{border-color:#ffd76a;box-shadow:0 0 12px rgba(255,215,106,.6)}
.chips.sueltas{background:none;border:0;padding:0}
.capa.secreto .caja{border:2px solid #c9b6ff;box-shadow:0 0 30px rgba(140,110,255,.6);animation:entra .4s cubic-bezier(.2,1.3,.4,1)}

/* ===== acabado general de las pestañas ===== */
@keyframes vista{from{opacity:0;transform:translateY(8px)}}
.cuerpo>.pad,.cuerpo>.plaza>.sobre{animation:vista .32s ease-out}
.rejilla>.ficha{animation:fichaentra .34s cubic-bezier(.2,1.2,.4,1) backwards}
.rejilla>.ficha:nth-child(2){animation-delay:.03s}.rejilla>.ficha:nth-child(3){animation-delay:.06s}.rejilla>.ficha:nth-child(4){animation-delay:.09s}.rejilla>.ficha:nth-child(5){animation-delay:.12s}.rejilla>.ficha:nth-child(6){animation-delay:.15s}.rejilla>.ficha:nth-child(n+7){animation-delay:.18s}
@keyframes fichaentra{from{opacity:0;transform:translateY(14px) scale(.92)}}
.ficha{background:linear-gradient(180deg,#342a45,#221b2e);box-shadow:0 3px 0 rgba(0,0,0,.35);transition:transform .12s}
.ficha:active{transform:scale(.96)}
.ficha.en{box-shadow:0 0 0 1px rgba(240,162,60,.4),0 0 14px rgba(240,162,60,.35),0 3px 0 rgba(0,0,0,.35)}
.caja{background:linear-gradient(180deg,rgba(52,42,69,.96),rgba(32,26,43,.96));border-color:#5a4a70;box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 4px 0 rgba(0,0,0,.3)}
.caja h2{color:#ffe3a8}
.btn{background:linear-gradient(180deg,#ffc266,#e8922c);box-shadow:inset 0 1px 0 rgba(255,255,255,.55),0 4px 0 #8a4f12;position:relative;overflow:hidden;transition:transform .08s,box-shadow .08s;text-shadow:0 1px 0 rgba(255,255,255,.35)}
.btn:not(:disabled)::after{content:"";position:absolute;top:0;bottom:0;width:40%;left:-60%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.5),transparent);animation:lustre 3.2s infinite}
@keyframes lustre{0%,60%{left:-60%}100%{left:130%}}
.btn:active:not(:disabled){transform:translateY(3px);box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 1px 0 #8a4f12}
.btn.sec{background:linear-gradient(180deg,#43375a,#2c233b);box-shadow:inset 0 1px 0 rgba(255,255,255,.1),0 4px 0 #17121f;text-shadow:none}
.btn.sec::after{display:none}
.barra{background:linear-gradient(180deg,#342a45,#241d30);border-bottom:2px solid #5a4a70;box-shadow:0 2px 8px rgba(0,0,0,.4);position:relative;z-index:3}
.barra .tit{color:#ffe3a8;text-shadow:0 2px 0 rgba(0,0,0,.5)}
.barra .rec{background:rgba(0,0,0,.3);padding:2px 8px 2px 4px;border-radius:999px;border:1px solid #5a4a70}
.nav{background:linear-gradient(180deg,#2c233b,#1c1626);border-top:2px solid #5a4a70}
.nav button{transition:transform .12s,color .12s}
.nav button[aria-current="page"]{box-shadow:none;transform:translateY(-3px);text-shadow:0 0 10px rgba(240,162,60,.8)}
.nav button[aria-current="page"] .nico{filter:drop-shadow(0 0 6px var(--ambar));animation:pinsalta .9s infinite alternate}
.chip{transition:transform .1s;box-shadow:0 2px 0 rgba(0,0,0,.35)}.chip:active{transform:scale(.94)}
.chip[aria-pressed="true"]{background:linear-gradient(180deg,#ffc266,#e8922c);box-shadow:0 0 10px rgba(240,162,60,.5)}
.plaza h1{font-size:44px;background:linear-gradient(180deg,#fff3d0,#f0a23c);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 0 rgba(0,0,0,.6))}
.plaza.altar h2{font-size:26px;color:#e3d8ff;text-shadow:0 0 16px #8c6eff}
.stats>div{background:linear-gradient(180deg,#342a45,#221b2e);border:1px solid #5a4a70;border-radius:8px}
.medidor{box-shadow:inset 0 1px 2px rgba(0,0,0,.6)}
.medidor i{background-image:linear-gradient(180deg,rgba(255,255,255,.35),rgba(255,255,255,0) 55%)}
.plaza{justify-content:flex-start}.plaza>.sobre{margin-top:auto}
.lucha.a .arte[data-hoja]{transform:scale(1.32)}
.corte.con-arte{background-size:cover;background-position:center;height:34%;border-top:3px solid var(--c);border-bottom:3px solid var(--c)}.corte.con-arte.sup{height:46%}
body{font-variant-numeric:lining-nums tabular-nums}
.carta.pulsada{transform:scale(.97);filter:brightness(1.15)}
.carta{-webkit-touch-callout:none}
.ayuda{font:500 12px var(--body)}
.modos button{font:700 13px var(--display)}
.nav button{font-weight:700}
.cb .l2{font:500 12px var(--body)}
.intento{font:700 12px var(--display)}
.nombre-e{font:700 11px var(--body)}
.nodo small{font:500 11px var(--body)}
.lucha.a::before,.lucha.e::before{bottom:-2%}
/* ===== estados, cajón de objetos, huerto ===== */
.ests{display:flex;gap:2px;flex-wrap:wrap;pointer-events:none}
.lucha .ests{position:absolute;left:0;right:0;bottom:-16px;justify-content:center;z-index:8}
.ests .ico{width:16px;height:16px;border-radius:50%;background-color:rgba(23,19,31,.85);font-size:10px;outline:1.5px solid #9be3b5}
.ests .ico.malo{outline-color:#ef5a4c;animation:late .8s infinite alternate}
.cn .ests{margin-left:auto}.cn .pista+.ests{margin-left:4px}
.carta.inmovil{filter:saturate(.3) brightness(.75)}
.num.veneno{color:#8fd14f}
.lucha.cayendo{transform:none!important;opacity:1}
.lucha.caido{opacity:.8;filter:brightness(.6) saturate(.5)}
.lucha.caido .hp,.lucha.caido .intento,.lucha.caido .ests,.lucha.caido .nombre-e,.lucha.caido .mira-obj{display:none}
.lucha.caido::before{opacity:.4}
.modos{grid-template-columns:1.25fr 1fr 1.25fr .9fr}
.modos button,.cajon button{display:flex;align-items:center;justify-content:center;gap:5px;padding:9px 4px}
.mico{width:18px;height:18px;flex:none;background-size:contain;background-repeat:no-repeat;background-position:center;image-rendering:pixelated}
.cajon{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;animation:vista .2s}
.cajon.dos{grid-template-columns:1fr 1fr}
.cajon button{background:var(--panel2);border:1px solid var(--linea);border-radius:8px;font:700 12px var(--display);white-space:nowrap;overflow:hidden}
.cajon button.obj{flex-direction:row;justify-content:flex-start;padding:7px 6px}
.cajon button.obj b{font-size:14px;color:#ffe3a8}.cajon button.obj span{overflow:hidden;text-overflow:ellipsis}
.cajon button.raro{border-color:#ffd76a}
.cajon button[aria-pressed="true"]{background:var(--ambar);color:var(--ambar-tinta);border-color:var(--ambar)}
.cajon button:disabled{opacity:.35}
.ent-est,.ent-exi{font:500 13px var(--body);color:#ffd9d2;display:flex;flex-wrap:wrap;gap:3px 8px;align-items:center;text-shadow:0 1px 0 #000}
.ent-exi{color:#ffe3a8;background:rgba(23,19,31,.6);border-left:3px solid var(--ambar);padding:3px 8px;border-radius:0 6px 6px 0}
.nav button{position:relative;font-size:12px;padding-left:0;padding-right:0}
.globo{position:absolute;top:2px;right:12%;min-width:16px;height:16px;border-radius:8px;background:#63c784;color:#0c2414;font:700 11px var(--body);display:grid;place-items:center;padding:0 4px}
.parcela.lista{border-color:#63c784;box-shadow:0 0 14px rgba(99,199,132,.35)}
.parcela.cerrada{opacity:.85;border-style:dashed}
.medidor.crece i{background-color:#63c784}
.aviso-granja{border-color:#63c784;color:#c9f5d6;animation:entra .3s}
/* ===== equipar y consejos ===== */
.tira{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;scrollbar-width:none}
.tira-eco{flex:none;width:64px;display:flex;flex-direction:column;align-items:center;gap:2px;font:700 11px var(--display);color:var(--tenue);opacity:.75}
.tira-eco .tc{position:relative;width:56px;height:56px;border-radius:12px;overflow:hidden;border:2px solid var(--linea);background:var(--panel2)}
.tira-eco.en .tc{border-color:#8a6a3a}
.tira-eco.sel{opacity:1;color:#ffe3a8}.tira-eco.sel .tc{border-color:var(--ambar);box-shadow:0 0 12px rgba(240,162,60,.6)}
.tira-eco span{max-width:64px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.huecos{display:flex;gap:3px}.huecos b{width:8px;height:8px;border-radius:2px;background:#3a3048;border:1px solid #5a4a70}.huecos b.on{background:var(--ambar);border-color:#fff3d0}
.maniqui{position:relative;height:250px;border-radius:14px;overflow:hidden;background:radial-gradient(circle at 50% 40%,#3d3155,#1c1626);border:2px solid #5a4a70}
.maniqui .halo{position:absolute;inset:-10%;background:radial-gradient(circle at 50% 55%,var(--c),transparent 60%);opacity:.35;animation:halo 3s ease-in-out infinite alternate}
.maniqui .man-img{position:absolute;left:22%;right:22%;top:0;bottom:0}
.maniqui .man-img>*{width:100%;height:100%;background-size:contain;background-repeat:no-repeat;background-position:center bottom}
.hueco{position:absolute;top:50%;transform:translateY(-50%);width:78px;display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center}
.hueco.arma{left:8px}.hueco.equipo{right:8px}
.hueco-ico{width:64px;height:64px;border-radius:14px;border:2px dashed #8a7aa5;background:rgba(23,19,31,.7);display:grid;place-items:center;font:700 28px var(--display);color:#8a7aa5;animation:nodolate 1.2s infinite alternate}
.hueco.lleno .hueco-ico{border-style:solid;border-color:var(--ambar);animation:none;box-shadow:0 0 12px rgba(240,162,60,.45)}
.hueco.sel .hueco-ico{border-color:#fff;box-shadow:0 0 0 3px var(--ambar),0 0 18px var(--ambar)}
.hueco-ico .ico{width:46px;height:46px}
.hueco small{font:700 11px var(--display);color:var(--ambar);text-transform:uppercase;letter-spacing:.06em;text-shadow:0 1px 0 #000}
.hueco b{font:700 12px/1.1 var(--display);color:#fff;text-shadow:0 1px 0 #000,0 0 6px #000}
.piezas{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pieza{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 4px;border-radius:12px;border:2px solid var(--linea);background:var(--panel2);text-align:center;-webkit-touch-callout:none;user-select:none}
.pieza-ico{width:48px;height:48px;display:grid;place-items:center}.pieza-ico .ico{width:44px;height:44px}
.pieza b{font:700 12px/1.1 var(--display)}.pieza small{font:500 11px/1.15 var(--body);color:var(--tenue)}
.pieza.encendida{border-color:var(--ambar);box-shadow:0 0 12px rgba(240,162,60,.45);background:linear-gradient(180deg,#4a3a5e,#2c233b)}
.pieza.encendida:active{transform:scale(.95)}
.pieza.apagada{opacity:.4;filter:grayscale(.9)}
.pieza.puesta{border-color:#63c784;box-shadow:0 0 12px rgba(99,199,132,.5)}.pieza.puesta small{color:#9be3b5}
.consejos{border-color:var(--ambar)}
.consejo{display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px solid rgba(255,255,255,.08);font-size:14px;text-align:left}
.consejo span{flex:1}.consejo .chip{flex:none;background:linear-gradient(180deg,#ffc266,#e8922c);color:var(--ambar-tinta);border-color:transparent}
.resultado .consejos{margin:8px 0;max-height:38vh;overflow:auto}
.cos-fila{display:flex;align-items:center;gap:8px;padding:5px 0;font-size:15px}
.cos-fila b{font:700 18px var(--display);color:#ffe3a8;min-width:64px}.cos-fila span{flex:1}.cos-fila small{color:var(--tenue)}
.cos-fila .ico{width:26px;height:26px}
.bono-n{font:800 20px var(--display);color:#8fd6ff;text-shadow:0 0 10px rgba(95,182,238,.6)}
.cajon.tres{grid-template-columns:1fr}.cajon.tres button{white-space:normal}
/* ===== elegir escuadrón ===== */
.equipo6{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin:8px 0}
.eq-hueco{display:flex;flex-direction:column;align-items:center;gap:2px;font:700 10px var(--display);color:var(--tinta);min-width:0}
.eq-hueco .tc{position:relative;width:100%;aspect-ratio:1;border-radius:10px;overflow:hidden;border:2px solid var(--ambar);background:var(--panel2);box-shadow:0 0 10px rgba(240,162,60,.35)}
.eq-hueco .tc.vacio{border:2px dashed #6a5a80;box-shadow:none;display:grid;place-items:center;font-size:22px;color:#6a5a80}
.eq-hueco span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.eq-hueco small{color:var(--tenue);font:500 10px var(--body)}
.eq-hueco:active .tc{transform:scale(.94)}
.equipo6.cambiando .eq-hueco .tc{animation:nodolate .7s infinite alternate;border-color:#fff}
.resumen{flex-wrap:wrap;gap:4px 12px;font-size:13px}.resumen .falta{color:#ffb3a8}
.ficha.eleg{position:relative;cursor:pointer;text-align:left}
.ficha.eleg .puesto{position:absolute;left:4px;top:4px;width:20px;height:20px;border-radius:50%;background:var(--ambar);color:var(--ambar-tinta);font:800 12px var(--display);display:grid;place-items:center;z-index:3}
.ficha.eleg .ver{position:absolute;right:4px;top:4px;z-index:4;font:700 11px var(--display);padding:5px 9px;border-radius:999px;background:rgba(23,19,31,.85);border:1px solid #8a7aa5;color:#ffe3a8;min-height:28px}

.ficha.elegida{outline:3px solid #fff;box-shadow:0 0 16px rgba(255,255,255,.6)}
.chips.envuelve{flex-wrap:wrap;overflow:visible}
.caja.familia{border-color:var(--ambar);background:linear-gradient(135deg,rgba(240,162,60,.14),transparent 60%),var(--panel)}
.btn.late{animation:late 1.6s ease-in-out infinite}
@keyframes late{0%,100%{box-shadow:0 0 0 0 rgba(240,162,60,.0)}50%{box-shadow:0 0 0 6px rgba(240,162,60,.28)}}
.talentos{display:flex;flex-direction:column;gap:12px}
.tal-cab .tc{position:relative;width:56px;height:56px;border-radius:12px;overflow:hidden;flex:none}
.tal-libres{flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;width:62px;height:62px;border-radius:50%;border:2px solid var(--linea);color:var(--tenue)}
.tal-libres b{font:700 24px var(--display);line-height:1}.tal-libres span{font-size:11px}
.tal-libres.on{border-color:var(--ambar);color:var(--ambar);box-shadow:0 0 14px rgba(240,162,60,.45)}
.caja.rama{border-left:4px solid var(--r);background:linear-gradient(100deg,color-mix(in srgb,var(--r) 13%,transparent),transparent 55%),var(--panel);display:flex;flex-direction:column;gap:8px}
.rama .lema{font-style:italic;color:var(--tenue);margin:-4px 0 2px}
.tnodo{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:8px 10px;border-radius:12px;border:1px dashed var(--linea);background:rgba(0,0,0,.18);color:var(--tinta);opacity:.62;transition:transform .1s,opacity .2s}
.tnodo.on{opacity:1;border-style:solid;border-color:color-mix(in srgb,var(--r) 60%,var(--linea))}
.tnodo.puede{opacity:1;border-color:var(--r);box-shadow:0 0 0 1px var(--r) inset}.tnodo.puede:active{transform:scale(.97)}
.tnodo.lleno{background:linear-gradient(90deg,color-mix(in srgb,var(--r) 24%,transparent),rgba(0,0,0,.18))}
.tnodo.maestra{border-width:2px;margin-top:4px}.tnodo.maestra.on{box-shadow:0 0 16px color-mix(in srgb,var(--r) 55%,transparent)}
.tnodo-ico{flex:none;width:46px;height:46px;border-radius:10px;overflow:hidden;display:grid;place-items:center;background:#0006}
.tnodo-ico>*{width:100%;height:100%}.tnodo:not(.on) .tnodo-ico{filter:grayscale(.85) brightness(.8)}
.tnodo-txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.tnodo-txt b{font:700 15px var(--display)}.tnodo-txt span{font-size:13.5px;line-height:1.3}.tnodo-txt small{font-size:12px;color:var(--tenue)}
.pips{flex:none;display:flex;flex-direction:column-reverse;gap:3px}
.pips i{width:9px;height:9px;border-radius:50%;border:1px solid var(--linea)}.pips i.on{background:var(--r);border-color:var(--r);box-shadow:0 0 5px var(--r)}
.premios{display:grid;grid-template-columns:repeat(auto-fill,minmax(68px,1fr));grid-auto-rows:min-content;align-content:start;gap:8px;margin:6px 0;flex:none}
.premio{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 4px 6px;border-radius:12px;border:1px solid var(--linea);background:rgba(0,0,0,.28);color:var(--tinta);animation:premio-entra .35s both cubic-bezier(.2,1.4,.4,1)}
.premio:active{transform:scale(.93)}
.premio-ico{width:46px;height:46px;display:grid;place-items:center}.premio-ico .ico{width:46px;height:46px;border-radius:8px;font-size:20px}
.premio b{font:700 15px var(--display);line-height:1.1;white-space:nowrap}
.premio.r1{border-color:#6fcf8f;box-shadow:0 0 0 1px #6fcf8f55 inset}.premio.r1 b{color:#a6efbd}
.premio.r2{border-color:#8fa8ff;background:linear-gradient(160deg,rgba(120,140,255,.28),rgba(0,0,0,.28));box-shadow:0 0 12px rgba(130,150,255,.55)}.premio.r2 b{color:#c9d4ff}
.premio.r3{border:2px solid #ffd76a;background:linear-gradient(160deg,rgba(255,200,80,.34),rgba(0,0,0,.3));box-shadow:0 0 18px rgba(255,205,90,.8);animation:premio-entra .45s both cubic-bezier(.2,1.4,.4,1),premio-brilla 1.6s 0.5s ease-in-out infinite}.premio.r3 b{color:#ffe9a8}
.premio.r2::after,.premio.r3::after{content:"";position:absolute;top:-5px;right:-5px;width:14px;height:14px;border-radius:50%;background:radial-gradient(circle,#fff,#ffd76a 55%,transparent 70%);animation:destello 1.2s ease-in-out infinite}
.premio.r2::after{background:radial-gradient(circle,#fff,#8fa8ff 55%,transparent 70%)}
.premio.falta{border-color:#e2574c;border-style:dashed}.premio.falta b{color:#ff8d84}.premio.falta .premio-ico{filter:grayscale(.6) brightness(.8)}
.premios.fila-mini{display:flex;flex-wrap:wrap;gap:6px}.premios.fila-mini.centro{justify-content:center}
.premio.mini{flex-direction:row;padding:4px 9px 4px 5px;gap:6px;border-radius:999px;animation:none}
.premio.mini .premio-ico,.premio.mini .premio-ico .ico{width:26px;height:26px;font-size:13px}.premio.mini b{font-size:14px}
@keyframes premio-entra{from{opacity:0;transform:translateY(10px) scale(.7)}to{opacity:1;transform:none}}
@keyframes premio-brilla{0%,100%{box-shadow:0 0 14px rgba(255,205,90,.6)}50%{box-shadow:0 0 26px rgba(255,220,120,1)}}
@keyframes destello{0%,100%{transform:scale(.6);opacity:.6}50%{transform:scale(1.25);opacity:1}}
.aviso-raro{align-self:center;padding:3px 14px;border-radius:999px;font:700 14px var(--display);color:#2a1c00;background:linear-gradient(90deg,#ffd76a,#ffb347);box-shadow:0 0 14px rgba(255,205,90,.7);text-align:center;margin:0 auto;width:max-content}
.subidas{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:4px 0}
.subida{display:flex;align-items:center;gap:6px;padding:3px 10px 3px 3px;border-radius:999px;border:1px solid #6fcf8f;background:rgba(60,160,100,.18)}
.subida .tc{position:relative;width:34px;height:34px;border-radius:50%;overflow:hidden;flex:none}.subida b{font:700 15px var(--display)}.subida i{font-style:normal;color:#6fcf8f;font-size:12px}
.abre{text-align:center;font:700 15px var(--display);color:#ffd76a;padding:6px;border-radius:10px;border:1px dashed #ffd76a}
.pista-toca{text-align:center;font-size:12.5px;margin:0}
.info-caja{align-items:center;text-align:center;display:flex;flex-direction:column;gap:8px;max-width:320px}
.info-ico .ico{width:84px;height:84px;border-radius:14px;font-size:34px}
.info-caja.r2{border-color:#8fa8ff;box-shadow:0 0 22px rgba(130,150,255,.5)}.info-caja.r3{border-color:#ffd76a;box-shadow:0 0 26px rgba(255,205,90,.6)}
.info-rareza{font:700 12px var(--display);letter-spacing:.08em;text-transform:uppercase;color:#ffd76a}.info-caja.r1 .info-rareza{color:#a6efbd}.info-caja.r2 .info-rareza{color:#c9d4ff}
.capa.info{z-index:60}
.ficha.conmarco{border:0;padding:0;background:none;box-shadow:none;aspect-ratio:3/4.15;display:block;overflow:visible}
.ficha.conmarco .img{position:absolute;inset:0;aspect-ratio:auto;border-radius:0;overflow:visible;background:none}
.ficha.conmarco .img .aura{position:absolute;inset:6% 8% 5.5%;border-radius:4px;background:radial-gradient(ellipse at 50% 38%,color-mix(in srgb,var(--c) 85%,#fff) 0%,color-mix(in srgb,var(--c) 70%,#1c1626) 38%,color-mix(in srgb,var(--c) 28%,#120e1a) 78%,#0d0a13 100%)}
.ficha.conmarco .img .aura::after{content:"";position:absolute;inset:0;background:repeating-conic-gradient(from 0deg at 50% 38%,rgba(255,255,255,.07) 0 6deg,transparent 6deg 18deg);mix-blend-mode:screen;border-radius:inherit}
.ficha.conmarco .img .arte{inset:6% 8% 5.5%;border-radius:4px;background-size:cover;background-position:50% 12%}
.ficha.conmarco .img .arte.pix{background-size:86%;background-position:center 45%}
.ficha.conmarco .img .pie-velo{position:absolute;inset:auto 8% 5.5%;height:34%;border-radius:0 0 4px 4px;background:linear-gradient(180deg,transparent,rgba(10,8,16,.88) 62%);pointer-events:none}
.ficha.conmarco .img .marco{inset:0;background-size:113% 106.5%;background-position:center;background-repeat:no-repeat}
.ficha.conmarco .nom,.ficha.conmarco .sub{position:absolute;left:12%;right:12%;z-index:3;text-shadow:0 1px 3px #000,0 0 6px #000}
.ficha.conmarco .nom{bottom:17%;font-size:15px;color:#fff}
.ficha.conmarco .sub{bottom:9%;white-space:nowrap;font-size:11.5px;color:#f1e6d0;gap:2px}.ficha.conmarco .sub .estrellas{transform:scale(.68);transform-origin:right center;flex:none;margin-left:-22px}
.ficha.conmarco .img .arte.prov{background-color:transparent!important;background-size:62%!important;background-position:center 42%!important}
.ficha.conmarco.en{filter:drop-shadow(0 0 7px rgba(240,162,60,.75))}
.ficha.conmarco:not(.en) .img .arte,.ficha.conmarco:not(.en) .img .aura{filter:saturate(.8) brightness(.86)}
.ficha.conmarco.eleg .puesto{left:-2px;top:-2px;width:24px;height:24px;box-shadow:0 0 0 2px #17131f}
.ficha.conmarco.eleg .ver{right:-2px;top:-2px}
.aviso-cambio{margin:6px 0 0;padding:6px 10px;border-radius:10px;background:var(--ambar);color:var(--ambar-tinta);font:700 14px var(--display);text-align:center}
.vec-fila{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 6px}
.vecino{flex:none;display:flex;flex-direction:column;align-items:center;gap:3px;width:62px;color:var(--tinta);position:relative}
.vecino .tc{position:relative;width:54px;height:54px;border-radius:50%;overflow:hidden;border:2px solid var(--linea);background:var(--panel2)}
.vecino span{font:600 12px var(--display);white-space:nowrap}.vecino:active{transform:scale(.94)}
.vecino.nuevo .tc{border-color:var(--ambar);box-shadow:0 0 12px rgba(240,162,60,.7)}
.vecino.nuevo::after{content:"…";position:absolute;right:0;top:-4px;min-width:20px;height:20px;border-radius:10px;background:#fff;color:#221b2e;font:800 14px/16px var(--display);text-align:center;animation:pinsalta .6s infinite alternate}
.plaza-accesos{gap:8px}
.acceso{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 4px;border-radius:12px;border:1px solid var(--linea);background:var(--panel2);color:var(--tinta);box-shadow:0 3px 0 rgba(0,0,0,.35)}
.acceso:active{transform:translateY(2px);box-shadow:none}.acceso .ico{width:34px;height:34px}.acceso b{font:700 14px var(--display)}.acceso small{font-size:11.5px;color:var(--tenue)}
.diario,.bestiario{display:flex;flex-direction:column;gap:12px}
.dia{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:7px 8px;border-radius:10px;border:1px solid var(--linea);background:rgba(0,0,0,.2);color:var(--tinta);margin-top:6px}
.dia:active{transform:scale(.98)}.dia.cerrada{opacity:.5;border-style:dashed}
.dia .tc{position:relative;flex:none;width:42px;height:42px;border-radius:50%;overflow:hidden;background:var(--panel2);display:grid;place-items:center;font:700 18px var(--display);color:var(--tenue)}
.dia-txt{flex:1;min-width:0;display:flex;flex-direction:column}.dia-txt b{font:700 14.5px var(--display)}.dia-txt span{font-size:13px;color:var(--tenue);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-style:italic}
.caja.cerrada-area{opacity:.5;border-style:dashed}
.bestias{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:6px}
.bestia{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 2px 5px;border-radius:10px;border:1px solid color-mix(in srgb,var(--c) 55%,var(--linea));background:radial-gradient(circle at 50% 40%,color-mix(in srgb,var(--c) 22%,transparent),rgba(0,0,0,.25));color:var(--tinta);min-width:0}
.bestia:active{transform:scale(.94)}.bestia.jefe{border-width:2px;border-color:#ffd76a}
.bestia-img{position:relative;width:100%;aspect-ratio:1}.bestia small{font-size:10.5px;line-height:1.15;text-align:center;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bestia>.punto,.bestia>i{position:absolute;left:3px;top:3px}
.bestia.sombra{border-color:var(--linea);background:rgba(0,0,0,.3)}.bestia.sombra .bestia-img{filter:brightness(0) opacity(.55)}
.info-sprite{position:relative;width:120px;height:120px}
.aro{position:absolute;inset:0;border-radius:7px;border:3px solid #ffe38a;box-shadow:0 0 8px #ffd76a,inset 0 0 10px rgba(255,215,106,.55);pointer-events:none;z-index:5;animation:aro linear both}
@keyframes aro{from{transform:scale(.1);opacity:.4}70%{opacity:1}to{transform:scale(1);opacity:1}}
.aro.ya{animation:none;transform:scale(1);border-color:#fff;background:rgba(255,255,255,.35);box-shadow:0 0 18px #fff;transition:opacity .25s;opacity:0}
.carta .orden{position:absolute;right:4px;top:4px;z-index:4;padding:1px 7px;border-radius:999px;background:#ffe38a;color:#3a2a00;font:800 12px var(--display);box-shadow:0 0 8px #ffd76a;animation:pinsalta .6s infinite alternate}
